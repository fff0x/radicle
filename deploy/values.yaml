# radicle/node — Helm values
# Used with charts/generic. See README.md in this directory.

fullnameOverride: seed-node
nameOverride: radicle-node

image:
  registry: oci.this-is-fine.io
  repository: radicle/node
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
strategy: Recreate
containerName: radicle

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false

service:
  enabled: true
  type: ClusterIP

ports:
  - name: http
    containerPort: 8080
  - name: p2p
    containerPort: 8776

env:
  - name: MODE
    value: seed-node
  - name: RAD_ALIAS
    value: seed.radicle.example
  # - name: RAD_EXTERNAL_ADDR
  #   value: seed.radicle.example:8776
  # - name: RAD_SEEDS
  #   value: "rad:z3gqcJUoA1n9HaHKufZs5FCSGazv5"
  # - name: RAD_PINNED_REPOS
  #   value: "rad:z3gqcJUoA1n9HaHKufZs5FCSGazv5"

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  mountPath: /node/radicle

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
