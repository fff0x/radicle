---
# p2p node protocol — must be reachable at RAD_EXTERNAL_ADDR for a seed to be
# useful. LoadBalancer gives it a routable address; point your DNS at the external
# IP. Use ClusterIP + a Gateway TCPRoute instead if you route p2p elsewhere.
apiVersion: v1
kind: Service
metadata:
  name: seed-node
  labels:
    app.kubernetes.io/name: seed-node
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: seed-node
  ports:
    - name: node
      port: 8776
      targetPort: node
      protocol: TCP
---
# HTTP API / web view — front this with an Ingress/HTTPRoute and TLS.
apiVersion: v1
kind: Service
metadata:
  name: seed-node-http
  labels:
    app.kubernetes.io/name: seed-node
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seed-node
  ports:
    - name: http
      port: 8080
      targetPort: http
